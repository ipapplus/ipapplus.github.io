<style>
:root{--bg:#0a0d14;--bg-2:#0f131e;--card:#11151f;--card-2:#161b27;--border:#1e2435;--border-2:#2a3145;--fg:#e4e7ec;--fg-2:#c1c6d1;--muted:#9aa3b7;--muted-2:#9aa3b7;--accent:#d4a574;--accent-soft:rgba(212,165,116,.1);--online:#4ade80;--online-glow:rgba(74,222,128,.4)}

body{min-height:100vh;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(212,165,116,.05),transparent 70%),radial-gradient(ellipse 60% 40% at 50% 100%,rgba(74,222,128,.025),transparent 70%),var(--bg);color:var(--fg);font-family:'Space Grotesk',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow-x:hidden}

.status{position:absolute;bottom:-3px;right:-3px;width:14px;height:14px;border-radius:50%;background:var(--online);border:3px solid var(--card);animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--online-glow)}50%{box-shadow:0 0 0 6px transparent}}
.header-text{flex:1;min-width:0}
.title{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);letter-spacing:.04em;margin-bottom:2px}
.title .sep{color:var(--accent)}
.name{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:600;color:var(--fg);letter-spacing:-.01em;margin-bottom:6px}
.bio{display:inline-flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:6px;border:1px solid rgba(212,165,116,.18)}
.bio svg{width:11px;height:11px}
.links{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.link-btn{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;background:var(--bg-2);border:1px solid var(--border);border-radius:12px;color:var(--fg-2);text-decoration:none;font-family:system-ui,sans-serif;font-size:13.5px;font-weight:500;transition:all .18s ease;cursor:pointer;position:relative;overflow:hidden}
.link-btn::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%) scaleY(0);width:2px;height:60%;background:var(--accent);transition:transform .2s;border-radius:0 2px 2px 0}
.link-btn:hover{border-color:var(--border-2);background:var(--card-2);color:var(--fg)}
.link-btn:hover::before{transform:translateY(-50%) scaleY(1)}
.link-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.link-btn .icon{width:18px;height:18px;color:var(--muted);transition:color .18s;flex-shrink:0}
.link-btn:hover .icon{color:var(--accent)}
.link-btn .label{flex:1;text-align:left}
.link-btn .arrow{width:12px;height:12px;color:var(--muted-2);opacity:0;transform:translateX(-4px);transition:all .18s;flex-shrink:0}
.link-btn:hover .arrow{opacity:1;transform:translateX(0);color:var(--accent)}
.footer{text-align:center;margin-top:18px;padding-top:16px;border-top:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted-2);letter-spacing:.05em}
.footer .accent{color:var(--accent)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--card);border:1px solid var(--border-2);color:var(--fg);padding:10px 18px;border-radius:10px;font-size:12px;font-weight:500;z-index:100;transition:transform .35s cubic-bezier(.4,0,.2,1);box-shadow:0 10px 30px rgba(0,0,0,.4);pointer-events:none;white-space:normal;max-width:calc(100vw - 32px);text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:440px){body{padding:16px}.card{padding:20px;border-radius:18px}.avatar{width:52px;height:52px}.name{font-size:16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.links{gap:0}.link-btn+ .link-btn{margin-top:8px}.link-btn{gap:0}.link-btn .icon{margin-right:12px}.header{gap:0}.avatar-wrap{margin-right:14px}.bio{gap:0}.bio svg{margin-right:5px}.link-btn:focus{outline:2px solid var(--accent);outline-offset:2px}.toast{bottom:calc(24px + env(safe-area-inset-bottom))}
</style>
</head>

<script>
(function(){
  'use strict';
  var toast=document.getElementById('toast');
  function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(function(){toast.classList.remove('show');},2800);}
  function fallbackCopy(){
    var area=document.createElement('textarea'), copied=false, focus=document.activeElement;
    area.value='https://ipapplus.github.io/';area.setAttribute('readonly','');area.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px';

    showToast(copied?'Repository URL copied':'Select and copy the repository URL above');
  }
  document.getElementById('add-sileo').addEventListener('click',function(){

    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText('https://ipapplus.github.io/').then(function(){showToast('Repository URL copied');},fallbackCopy);}else{fallbackCopy();}}catch(error){fallbackCopy();}
  });
  var canvas=document.getElementById('snow'),ctx=canvas.getContext('2d');
  if(!ctx)return;
  var W=0,H=0,flakes=[],reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function createFlake(initial){return{x:Math.random()*W,y:initial?Math.random()*H:-10,r:Math.random()*1.6+.4,vy:Math.random()*.5+.2,vx:(Math.random()-.5)*.3,o:Math.random()*.5+.2,sway:Math.random()*.02+.005,angle:Math.random()*Math.PI*2};}
  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;var count=reduceMotion?15:Math.min(70,Math.floor(W/20));flakes=[];for(var i=0;i<count;i++)flakes.push(createFlake(true));}
  function tick(){ctx.clearRect(0,0,W,H);for(var i=0;i<flakes.length;i++){var f=flakes[i];f.angle+=f.sway;f.y+=f.vy;f.x+=f.vx+Math.sin(f.angle)*.3;if(f.y>H+5){f.y=-5;f.x=Math.random()*W;}if(f.x>W+5)f.x=-5;if(f.x< -5)f.x=W+5;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fillStyle='rgba(220,225,240,'+f.o+')';ctx.fill();}if(!reduceMotion&&!document.hidden&&window.requestAnimationFrame)window.requestAnimationFrame(tick);}
  resize();window.addEventListener('resize',resize);tick();document.addEventListener('visibilitychange',function(){if(!document.hidden&&!reduceMotion)tick();});
})();
</script>
