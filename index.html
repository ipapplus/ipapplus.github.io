<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ipapplus</title>
<meta name="description" content="Ahmed AlGhrbi — Systems & Apps">
<meta name="theme-color" content="#0a0d14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0d14;--bg-2:#0f131e;--card:#11151f;--card-2:#161b27;--border:#1e2435;--border-2:#2a3145;--fg:#e4e7ec;--fg-2:#c1c6d1;--muted:#6b7489;--muted-2:#4a5169;--accent:#d4a574;--accent-soft:rgba(212,165,116,.1);--online:#4ade80;--online-glow:rgba(74,222,128,.4)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{min-height:100vh;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(212,165,116,.05),transparent 70%),radial-gradient(ellipse 60% 40% at 50% 100%,rgba(74,222,128,.025),transparent 70%),var(--bg);color:var(--fg);font-family:'Space Grotesk',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow-x:hidden}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
.card{position:relative;z-index:1;width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;box-shadow:0 24px 60px -12px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.02) inset,0 1px 0 rgba(255,255,255,.04) inset}
.card::before{content:'';position:absolute;top:-1px;left:28%;right:28%;height:1px;background:linear-gradient(90deg,transparent,rgba(212,165,116,.55),transparent)}
.header{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.avatar-wrap{position:relative;flex-shrink:0}
.avatar{width:56px;height:56px;border-radius:14px;object-fit:cover;border:1px solid var(--border-2);background:var(--bg-2);display:block;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.status{position:absolute;bottom:-3px;right:-3px;width:14px;height:14px;border-radius:50%;background:var(--online);border:3px solid var(--card);animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--online-glow)}50%{box-shadow:0 0 0 6px transparent}}
.header-text{flex:1;min-width:0}
.title{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);letter-spacing:.04em;margin-bottom:2px}
.title .sep{color:var(--accent)}
.name{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:600;color:var(--fg);letter-spacing:-.01em;margin-bottom:6px}
.bio{display:inline-flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:6px;border:1px solid rgba(212,165,116,.18)}
.bio svg{width:11px;height:11px}
.links{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.link-btn{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;background:var(--bg-2);border:1px solid var(--border);border-radius:12px;color:var(--fg-2);text-decoration:none;font-family:'Space Grotesk',sans-serif;font-size:13.5px;font-weight:500;transition:all .18s ease;cursor:pointer;position:relative;overflow:hidden}
.link-btn::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%) scaleY(0);width:2px;height:60%;background:var(--accent);transition:transform .2s;border-radius:0 2px 2px 0}
.link-btn:hover{border-color:var(--border-2);background:var(--card-2);color:var(--fg)}
.link-btn:hover::before{transform:translateY(-50%) scaleY(1)}
.link-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.link-btn .icon{width:18px;height:18px;color:var(--muted);transition:color .18s;flex-shrink:0}
.link-btn:hover .icon{color:var(--accent)}
.link-btn .label{flex:1;text-align:left}
.link-btn .arrow{width:12px;height:12px;color:var(--muted-2);opacity:0;transform:translateX(-4px);transition:all .18s;flex-shrink:0}
.link-btn:hover .arrow{opacity:1;transform:translateX(0);color:var(--accent)}
.footer{text-align:center;margin-top:18px;padding-top:16px;border-top:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted-2);letter-spacing:.05em}
.footer .accent{color:var(--accent)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--card);border:1px solid var(--border-2);color:var(--fg);padding:10px 18px;border-radius:10px;font-size:12px;font-weight:500;z-index:100;transition:transform .35s cubic-bezier(.4,0,.2,1);box-shadow:0 10px 30px rgba(0,0,0,.4);pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.package-browser{margin-top:22px;padding-top:18px;border-top:1px solid var(--border)}
.package-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;margin-bottom:12px}
.package-browser h2{font-size:17px}
.package-search-toggle{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid var(--border-2);border-radius:10px;background:var(--bg-2);color:var(--fg-2);cursor:pointer}
.package-search-toggle svg{width:19px;height:19px}
.package-search-toggle[aria-expanded="true"]{color:var(--accent);border-color:var(--accent)}
.package-search-panel{position:absolute;top:calc(100% + 8px);right:0;width:100%;padding:14px;background:var(--card-2);border:1px solid var(--border-2);border-radius:12px;box-shadow:0 12px 28px rgba(0,0,0,.4);z-index:3}
.package-search-panel[hidden],.package-choices[hidden]{display:none}
.package-browser label{display:block;font-size:12px;color:var(--fg-2);margin-bottom:6px}
#package-search{width:100%;padding:12px;border:1px solid var(--border-2);border-radius:10px;background:var(--bg-2);color:var(--fg);font:inherit;font-size:16px}
#package-search:focus-visible,.package-download:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#package-status{margin:10px 0;font-size:12px;color:var(--fg-2)}
#package-list{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow-y:auto}
.package-entry{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;column-gap:8px;row-gap:4px;padding:12px;background:var(--bg-2);border:1px solid var(--border);border-radius:12px;flex-shrink:0}
.package-entry[hidden]{display:none}
.package-content{min-width:0}
.package-title{display:flex;align-items:baseline;gap:6px;min-width:0;margin-bottom:6px}
.package-entry h3{font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.package-version{font-size:10px;color:var(--muted);flex-shrink:1;min-width:0;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.package-meta{grid-column:1/-1;font-size:10px;color:var(--muted);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.package-description{font-size:12px;line-height:1.5;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.package-download{display:inline-flex;align-items:center;justify-content:center;padding:8px;min-height:36px;border:1px solid var(--border-2);border-radius:8px;background:var(--accent-soft);color:var(--accent);text-decoration:none;font:inherit;font-size:11px;cursor:pointer}
.package-actions,.architecture-filters{display:flex;align-items:center;gap:6px}
.architecture-filters{margin-top:10px}
.package-copy,.architecture-filters button{border:1px solid var(--border-2);border-radius:8px;background:var(--bg-2);color:var(--fg-2);font:inherit;cursor:pointer}
.architecture-filters{flex-wrap:wrap}
.architecture-filters button{padding:10px;font-size:12px;min-height:44px}
.package-copy{width:32px;min-height:36px;padding:3px;font-size:0;flex-shrink:0}
.package-copy::before{content:'⧉';display:block;font-size:17px;line-height:1.2}
.package-copy[data-feedback="Copied!"]::before{content:'✓';color:var(--accent)}
.package-copy[data-feedback="Copy failed"]::before{content:'!'}
.package-choices{position:fixed;z-index:30;width:140px;max-width:calc(100vw - 16px);padding:5px;border:1px solid var(--border-2);border-radius:10px;background:var(--card-2);box-shadow:0 12px 28px rgba(0,0,0,.4);overflow-y:auto}
.package-choice{display:block}
.package-choice[hidden]{display:none}
.package-target{display:block;width:100%;padding:11px 10px;min-height:40px;border:0;border-radius:6px;background:transparent;color:var(--fg-2);text-decoration:none;text-align:left;font:inherit;font-size:12px;cursor:pointer}
.package-target:hover,.package-target:focus-visible{background:var(--accent-soft);color:var(--accent)}
.package-target[hidden]{display:none}
.architecture-filters button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.package-copy:focus-visible,.architecture-filters button:focus-visible,.package-search-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#last-updated{margin-top:18px;color:var(--fg-2);font-size:12px;line-height:1.5}
@media(max-width:440px){body{padding:16px}.card{padding:20px;border-radius:18px}.avatar{width:52px;height:52px}.name{font-size:16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

<script>
(function(){
  'use strict';
  const canvas=document.getElementById('snow');
  const ctx=canvas.getContext('2d');
  let W=0,H=0,flakes=[];
  const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function createFlake(initial){return{x:Math.random()*W,y:initial?Math.random()*H:-10,r:Math.random()*1.6+.4,vy:Math.random()*.5+.2,vx:(Math.random()-.5)*.3,o:Math.random()*.5+.2,sway:Math.random()*.02+.005,angle:Math.random()*Math.PI*2}}
  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;const count=reduceMotion?15:Math.min(70,Math.floor(W/20));flakes=Array.from({length:count},()=>createFlake(true))}
  function tick(){ctx.clearRect(0,0,W,H);for(const f of flakes){f.angle+=f.sway;f.y+=f.vy;f.x+=f.vx+Math.sin(f.angle)*.3;if(f.y>H+5){f.y=-5;f.x=Math.random()*W}if(f.x>W+5)f.x=-5;if(f.x< -5)f.x=W+5;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fillStyle=`rgba(220,225,240,${f.o})`;ctx.fill()}if(!reduceMotion)requestAnimationFrame(tick)}
  resize();window.addEventListener('resize',resize);tick();
  const toast=document.getElementById('toast');
  function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove('show'),2800)}
  document.getElementById('sileo').addEventListener('click',()=>{
    const source='https://ipapplus.github.io';
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(source).then(()=>showToast('Source URL copied')).catch(()=>{});}else{
      const area=document.createElement('textarea');area.value=source;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();const copied=document.execCommand('copy');area.remove();if(copied)showToast('Source URL copied');
    }
  });
})();
</script>
<script>
(function(){
  'use strict';
  const search=document.getElementById('package-search');
  const status=document.getElementById('package-status');
  const list=document.getElementById('package-list');
  const architectureButtons=document.querySelectorAll('[data-architecture]');
  const architectureNames={'iphoneos-arm':'arm','iphoneos-arm64':'arm64','iphoneos-arm64e':'arm64e'};
  const architectureLabels={arm:'Rootful',arm64:'Rootless',arm64e:'RootHide'};
  const searchToggle=document.getElementById('package-search-toggle');
  const searchPanel=document.getElementById('package-search-panel');
  const toolbar=document.getElementById('package-toolbar');
  let selectedArchitecture='';
  let entries=[];
  function closeSearch(reset=false){
    searchPanel.hidden=true;
    searchToggle.setAttribute('aria-expanded','false');
    if(reset){
      search.value='';selectedArchitecture='';
      architectureButtons.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.architecture==='')));
      filterPackages();
    }
  }
  searchToggle.addEventListener('click',()=>{
    if(!searchPanel.hidden){closeSearch(true);return;}
    entries.forEach(closeChoices);
    searchPanel.hidden=false;
    searchToggle.setAttribute('aria-expanded','true');
    search.focus();
  });
  function closeChoices(entry){
    if(entry.choices){
      entry.choices.hidden=true;
      entry.download.setAttribute('aria-expanded','false');
      entry.copy.setAttribute('aria-expanded','false');
    }
  }
  document.addEventListener('click',event=>{
    if(!toolbar.contains(event.target))closeSearch();
    entries.forEach(entry=>{
      if(!entry.card.contains(event.target)&&!(entry.choices&&entry.choices.contains(event.target)))closeChoices(entry);
    });
  });
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'){
      if(!searchPanel.hidden){closeSearch(true);searchToggle.focus();}
      entries.forEach(entry=>{
        if(entry.choices&&!entry.choices.hidden){closeChoices(entry);entry.download.focus();}
      });
    }
  });
  list.addEventListener('scroll',()=>entries.forEach(closeChoices));
  window.addEventListener('resize',()=>entries.forEach(closeChoices));
  window.addEventListener('scroll',()=>entries.forEach(closeChoices));
  function positionChoices(entry,button){
    const rect=button.getBoundingClientRect();
    const viewport=window.visualViewport;
    const left=viewport?viewport.offsetLeft:0,top=viewport?viewport.offsetTop:0;
    const width=viewport?viewport.width:window.innerWidth,height=viewport?viewport.height:window.innerHeight;
    const menu=entry.choices;
    menu.style.width=Math.min(140,width-16)+'px';
    menu.style.maxHeight=Math.max(40,height-16)+'px';
    menu.style.left=Math.max(left+8,Math.min(rect.right-menu.offsetWidth,left+width-menu.offsetWidth-8))+'px';
    const below=rect.bottom+6;
    menu.style.top=Math.max(top+8,Math.min(below+menu.offsetHeight<=top+height-8?below:rect.top-menu.offsetHeight-6,top+height-menu.offsetHeight-8))+'px';
  }
  function parsePackages(text){
    return text.replace(/\r\n?/g,'\n').split(/\n[ \t]*\n/).filter(block=>block.trim()).map(block=>{
      const fields=Object.create(null);
      let key='';
      for(const line of block.split('\n')){
        if(/^[ \t]/.test(line)){
          if(key)fields[key]+='\n'+(line.trim()==='.'?'':line.slice(1));
        }else{
          const colon=line.indexOf(':');
          key=colon>0?line.slice(0,colon):'';
          if(key)fields[key]=line.slice(colon+1).trim();
        }
      }
      return fields;
    });
  }
  function sizeLabel(value){
    if(!value)return '';
    const bytes=Number(value);
    if(!Number.isFinite(bytes)||bytes<0)return '';
    if(bytes<1024)return bytes+' B';
    if(bytes<1048576)return (bytes/1024).toFixed(1)+' KB';
    return (bytes/1048576).toFixed(1)+' MB';
  }
  function addText(parent,tag,className,text){
    const element=document.createElement(tag);
    element.className=className;
    element.textContent=text;
    parent.appendChild(element);
    return element;
  }
  function filterPackages(){
    const query=search.value.toLowerCase();
    let count=0;
    for(const entry of entries){
      const matching=entry.variants.filter(variant=>variant.searchText.includes(query)&&(selectedArchitecture===''||variant.architecture===selectedArchitecture));
      entry.card.hidden=matching.length===0;
      entry.meta.textContent=[...new Set(matching.map(variant=>architectureLabels[variant.architecture]||variant.architecture))].join(' · ');
      entry.variants.forEach(variant=>{if(variant.row)variant.row.hidden=!matching.includes(variant);});
      closeChoices(entry);
      if(!entry.card.hidden)count++;
    }
    status.textContent=count?count+' of '+entries.length+' packages':'No packages found';
  }
  search.addEventListener('input',filterPackages);
  architectureButtons.forEach(button=>button.addEventListener('click',()=>{
    selectedArchitecture=button.dataset.architecture;
    architectureButtons.forEach(option=>option.setAttribute('aria-pressed',String(option===button)));
    filterPackages();
  }));
  async function copyLink(button,url){
    try{
      if(navigator.clipboard&&window.isSecureContext){
        await navigator.clipboard.writeText(url);
      }else{
        const area=document.createElement('textarea');
        area.value=url;area.style.position='fixed';area.style.opacity='0';
        document.body.appendChild(area);area.select();
        try{if(!document.execCommand('copy'))throw new Error('Copy failed');}
        finally{area.remove();button.focus();}
      }
      button.textContent='Copied!';
    }catch(error){
      button.textContent='Copy failed';
    }
    button.setAttribute('data-feedback',button.textContent);
    button.setAttribute('aria-label',button.textContent);
    clearTimeout(button.copyTimer);
    button.copyTimer=setTimeout(()=>{
      button.textContent='Copy Link';button.removeAttribute('data-feedback');
      button.setAttribute('aria-label','Copy download link');
    },2000);
  }
  const indexURL=new URL('Packages',window.location.href);
  const updated=document.getElementById('last-updated');
  fetch(indexURL).then(response=>{
    if(!response.ok)throw new Error('Package index request failed');
    const modified=response.headers.get('Last-Modified');
    const date=modified?new Date(modified):null;
    if(date&&!Number.isNaN(date.getTime())){
      const seconds=Math.max(0,Math.floor((Date.now()-date.getTime())/1000));
      let relative='Just now';
      if(seconds>=60){
        const unit=seconds>=86400?'day':seconds>=3600?'hour':'minute';
        const count=Math.floor(seconds/(unit==='day'?86400:unit==='hour'?3600:60));
        relative=count+' '+unit+(count===1?'':'s')+' ago';
      }
      updated.textContent='Last Updated: '+relative;
    }else{
      updated.textContent='Last Updated: Unknown';
    }
    return response.text();
  }).then(text=>{
    const fragment=document.createDocumentFragment();
    const groups=[];
    const groupsByKey=new Map();
    // Group only matching identities/versions with identical display metadata.
    // Never hide a second file for the same architecture inside a merged card.
    parsePackages(text).forEach(pkg=>{
      const key=JSON.stringify([pkg.Package,pkg.Version,pkg.Name,pkg.Description,pkg.Maintainer]);
      let group=groupsByKey.get(key);
      if(!pkg.Package||!pkg.Version||!group||group.some(other=>other.Architecture===pkg.Architecture)){
        group=[];groups.push(group);groupsByKey.set(key,group);
      }
      group.push(pkg);
    });
    entries=groups.map((group,groupIndex)=>{
      const pkg=group[0];
      const card=document.createElement('article');
      card.className='package-entry';
      const content=document.createElement('div');
      content.className='package-content';card.appendChild(content);
      const title=document.createElement('div');title.className='package-title';content.appendChild(title);
      const name=addText(title,'h3','',pkg.Name||pkg.Package||'Unnamed package');
      name.title=pkg.Package||name.textContent;
      if(pkg.Version){const version=addText(title,'span','package-version',pkg.Version);version.title=pkg.Version;}
      if(pkg.Description){const description=addText(content,'p','package-description',pkg.Description);description.title=pkg.Description;}
      const actions=document.createElement('div');
      actions.className='package-actions';card.appendChild(actions);
      const meta=addText(card,'p','package-meta','');
      const variants=group.map(item=>({
        pkg:item,architecture:architectureNames[item.Architecture]||item.Architecture,
        searchText:[item.Package,item.Name,item.Filename,item.Description].filter(Boolean).join('\n').toLowerCase()
      }));
      const entry={card,meta,variants};
      function addDownload(parent,item){
        const link=addText(parent,'a','package-download','Download');
        link.href=new URL(item.Filename,indexURL).href;
        link.setAttribute('download','');
        link.title=sizeLabel(item.Size)?'Download · '+sizeLabel(item.Size):'Download';
        const copy=addText(parent,'button','package-copy','Copy Link');
        copy.type='button';
        copy.setAttribute('aria-label','Copy download link');
        copy.addEventListener('click',()=>copyLink(copy,link.href));
      }
      if(group.length===1){
        if(pkg.Filename)addDownload(actions,pkg);
      }else{
        entry.download=addText(actions,'button','package-download','Download');
        entry.copy=addText(actions,'button','package-copy','Copy Link');
        entry.choices=document.createElement('div');
        entry.choices.className='package-choices';entry.choices.hidden=true;
        entry.choices.id='package-choices-'+groupIndex;
        document.body.appendChild(entry.choices);
        [entry.download,entry.copy].forEach(button=>{
          button.type='button';button.setAttribute('aria-expanded','false');
          button.setAttribute('aria-controls',entry.choices.id);
          button.setAttribute('aria-label',button===entry.copy?'Choose architecture to copy download link':'Choose download architecture');
          button.addEventListener('click',()=>{
            const open=entry.choices.hidden;
            entries.forEach(closeChoices);
            entry.choices.hidden=!open;
            entry.download.setAttribute('aria-expanded',String(open));
            entry.copy.setAttribute('aria-expanded',String(open));
            if(open){
              variants.forEach(variant=>{
                variant.link.hidden=button===entry.copy;
                variant.copy.hidden=button!==entry.copy;
              });
              positionChoices(entry,button);
              const first=variants.find(variant=>variant.row&&!variant.row.hidden);
              if(first)(button===entry.copy?first.copy:first.link).focus();
            }
          });
        });
        variants.forEach(variant=>{
          const row=document.createElement('div');row.className='package-choice';variant.row=row;
          const label=architectureLabels[variant.architecture]||variant.architecture;
          const link=addText(row,'a','package-target',label);variant.link=link;
          link.href=new URL(variant.pkg.Filename,indexURL).href;link.setAttribute('download','');
          link.addEventListener('click',()=>closeChoices(entry));
          const copy=addText(row,'button','package-target',label);variant.copy=copy;
          copy.type='button';copy.hidden=true;
          copy.addEventListener('click',()=>{
            copyLink(entry.copy,link.href);closeChoices(entry);entry.copy.focus();
          });
          entry.choices.appendChild(row);
        });
      }
      fragment.appendChild(card);
      return entry;
    });
    list.appendChild(fragment);
    search.disabled=false;
    filterPackages();
  }).catch(()=>{
    status.textContent='Unable to load packages. Please reload to try again.';
  });
})();
</script>
</body>
</html>
