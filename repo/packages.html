<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ipapplus">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta data-i18n-content="packagesDescription" name="description" content="Browse, search, and download packages from the ipapplus repository.">
<title data-i18n="packagesTitle">Packages · ipapplus Repo</title>
<script src="assets/js/i18n.js?v=locale-1"></script>
<link rel="stylesheet" href="assets/css/website.css?v=locale-1">
</head>
<body>
<a class="skip-link" data-i18n="skipPackages" href="#package-list">Skip to packages</a>
<main class="browser">
  <div class="browser-toolbar">
  <a class="back" href="index.html"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg><span data-i18n="repoName" dir="auto">ipapplus Repo</span></a>
    <button class="language-switch" type="button" data-language-switch aria-label="Switch to Arabic" title="Switch to Arabic"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a18 18 0 0 1 0 18 18 18 0 0 1 0-18"/></svg><span lang="ar" dir="auto">العربية</span></button>
  </div>
  <header class="browser-header">
    <div class="heading">
      <h1 data-i18n="packages">Packages</h1>
      <button class="icon-button" id="refresh-packages" type="button" data-i18n-aria-label="refreshPackages" aria-label="Refresh packages" data-i18n-title="refreshPackages" title="Refresh packages"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14-5L3 9m0-6v6h6M4 13a8 8 0 0 0 14 5l3-3m0 6v-6h-6"/></svg></button>
    </div>
    <p class="updated" id="last-updated" data-i18n="updatedUnknown">Last updated: Unavailable</p>
  </header>
  <section class="search-panel" data-i18n-aria-label="searchFilter" aria-label="Search and filter packages">
    <label class="sr-only" data-i18n="searchHelp" for="package-search">Search by name, Package ID, description, or filename</label>
    <div class="search-field">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
      <input id="package-search" dir="auto" data-i18n-placeholder="searchPackages" type="search" placeholder="Search packages" autocomplete="off" autocapitalize="none" spellcheck="false" aria-controls="package-list">
      <button class="search-clear" id="search-clear" type="button" data-i18n-aria-label="clearSearch" aria-label="Clear search" data-i18n-title="clearSearch" title="Clear search" hidden><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m7 7 10 10M7 17 17 7"/></svg></button>
    </div>
    <div class="architecture-filters" role="group" data-i18n-aria-label="filterArchitecture" aria-label="Filter by package architecture">
      <button data-i18n="all" type="button" data-architecture="" aria-pressed="true">All</button>
      <button type="button" data-architecture="iphoneos-arm" dir="ltr" lang="en" aria-pressed="false">Rootful</button>
      <button type="button" data-architecture="iphoneos-arm64" dir="ltr" lang="en" aria-pressed="false">Rootless</button>
      <button type="button" data-architecture="iphoneos-arm64e" dir="ltr" lang="en" aria-pressed="false">RootHide</button>
    </div>
  </section>
  <div class="results-bar">
    <p id="package-status" data-i18n="loadingPackages" role="status" aria-live="polite" aria-atomic="true">Loading packages…</p>
    <button class="reset-filters" id="reset-filters" data-i18n="resetFilters" type="button" hidden>Reset filters</button>
  </div>
  <div id="package-list" tabindex="-1" data-i18n-aria-label="availablePackages" aria-label="Available packages" aria-busy="true"></div>
  <section class="empty-state" id="empty-state" hidden>
    <h2 id="empty-heading" data-i18n="noPackagesFound">No packages found</h2>
    <p id="empty-message" data-i18n="trySearch">Try another search or package architecture.</p>
    <button id="empty-action" data-i18n="resetFilters" type="button">Reset filters</button>
  </section>
  <noscript><p lang="en" dir="ltr">Enable JavaScript to browse packages.</p><p lang="ar" dir="rtl">فعّل JavaScript لتصفّح الحزم.</p></noscript>
</main>
<button class="icon-button back-to-top" id="back-to-top" type="button" data-i18n-aria-label="backToTop" aria-label="Back to top" data-i18n-title="backToTop" title="Back to top" inert aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 13 6-6 6 6M12 7v13"/></svg></button>
<div class="package-choices" id="build-menu" role="menu" data-i18n-aria-label="chooseArchitecture" aria-label="Choose a package architecture" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<script src="assets/js/website.js?v=locale-1"></script>
<script src="assets/js/packages.js?v=locale-1"></script>
</body>
</html>
