<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>

  <link rel="canonical" href="https://ipapplus.github.io/">

  <!-- Open Graph & Social -->
  <meta property="og:title" content="Ahmed AlGhrbi · ipapplus">
  <meta property="og:description" content="Official ipapplus iOS software repository.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ipapplus.github.io/">
  <meta property="og:image" content="https://ipapplus.github.io/social-preview.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Ahmed AlGhrbi · ipapplus">

  <meta name="twitter:image" content="https://ipapplus.github.io/social-preview.png">

  <!-- Apple & PWA Capabilities -->
  <meta name="theme-color" content="#080c14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ipapplus">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="website.css">

  <!-- Instant Theme Boot Script (Prevents Flash of Wrong Theme) -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('ipapplus-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = saved === 'light' ? 'light' : (saved === 'dark' ? 'dark' : (prefersDark ? 'dark' : 'light'));
        if (saved && saved !== 'system') {
          document.documentElement.dataset.theme = saved;
        }
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#080c14' : '#f5f6fa');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Minimalist Sticky Header -->
  <header class="site-header">
    <div class="app-shell container-narrow header-row">
      <div class="brand-badge">
        <span class="brand-glyph" aria-hidden="true">I</span>
        <span>ipapplus</span>
      </div>

      <div class="header-nav">
        <button class="nav-pill-btn" id="refresh-home" data-page-refresh type="button" aria-label="Refresh page" title="Refresh page">
          <svg style="width:15px; height:15px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
            <path d="M16 21h5v-5"></path>
          </svg>
          <span class="refresh-label">Refresh</span>
        </button>

        <div class="theme-switch-deck" role="group" aria-label="Appearance Mode">
          <button type="button" class="theme-pill-btn" data-theme-choice="system" aria-label="System Appearance">Auto</button>
          <button type="button" class="theme-pill-btn" data-theme-choice="dark" aria-label="Dark Mode">Dark</button>
          <button type="button" class="theme-pill-btn" data-theme-choice="light" aria-label="Light Mode">Light</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Profile & Action Hub -->
  <main id="main-content" class="app-shell container-narrow profile-card-stage">
    
    <!-- Profile Card -->
    <article class="profile-header-card">
      <div class="avatar-container">
        <img class="avatar-image" src="https://i.imgur.com/oMBfPA9.jpeg" alt="Ahmed AlGhrbi avatar" width="72" height="72" onerror="this.style.display='none'; document.getElementById('avatar-fallback').style.display='grid';">
        <div id="avatar-fallback" class="avatar-fallback" style="display:none;" aria-hidden="true">AG</div>
        <span class="online-pulse-dot" title="Online" aria-label="System status online"></span>
      </div>

      <h1 class="profile-name">Ahmed AlGhrbi</h1>
      <p class="profile-role">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"></polyline>
          <polyline points="8 6 2 12 8 18"></polyline>
        </svg>
        <span>Systems &amp; Apps</span>
      </p>

      <div class="repo-summary-pill">
        <strong>395 Packages</strong>
        <span class="summary-sep">•</span>
        <span>iOS 11–16+</span>
        <span class="summary-sep">•</span>
        <span style="color:var(--accent-green); font-weight:600;">Active</span>
      </div>
    </article>

    <!-- Action Links Deck -->

          </svg>
        </div>
        <div class="action-text-group">
          <span class="action-main-title">Browse Tweaks</span>
        </div>
        <span class="action-card-badge">395</span>
        <svg class="action-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m9 18 6-6-6-6"></path>
        </svg>

      <!-- Copy Source URL Card -->

          <span class="copy-url-hint">Repository Source URL (Tap to copy)</span>
          <code class="copy-url-text">https://ipapplus.github.io</code>
        </div>
        <div class="copy-action-icon" aria-hidden="true">
          <svg style="width:16px; height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="8" y="8" width="12" height="12" rx="2"></rect>

        </div>

          <line x1="7" y1="17" x2="17" y2="7"></line>
          <polyline points="7 7 17 7 17 17"></polyline>
        </svg>
      </a>

      <!-- GitHub Link Card -->
      <a class="action-card" href="https://github.com/ipapplus" target="_blank" rel="noopener noreferrer" aria-label="Visit ipapplus on GitHub">
        <div class="action-icon-wrap" aria-hidden="true">
          <svg style="width:17px; height:17px;" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"></path>
          </svg>
        </div>
        <div class="action-text-group">
          <span class="action-main-title">GitHub</span>
        </div>
        <svg class="action-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="7" y1="17" x2="17" y2="7"></line>

    <!-- Add to Home Screen PWA Section -->

</html>
