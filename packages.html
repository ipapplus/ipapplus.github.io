<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0d14"><title>Tweaks · ipapplus Repo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0d14;color:#e4e7ec;font:14px/1.4 system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}main{max-width:760px;margin:0 auto;padding:24px 14px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}a{color:#d4a574}button,input{font:inherit}button,a{-webkit-tap-highlight-color:rgba(212,165,116,.15)}a:focus,button:focus,input:focus{outline:2px solid #d4a574;outline-offset:3px}[hidden]{display:none!important}.back{display:inline-block;min-height:44px;padding:10px 0;text-decoration:none}.heading{display:flex;align-items:center;justify-content:space-between;margin:10px 0 2px}h1{font-size:26px;line-height:1.1;letter-spacing:-.04em;margin:0 8px 0 0}.icon-button{flex-shrink:0;width:44px;height:44px;background:#11151f;color:#d4a574;border:1px solid #30384a;border-radius:10px;cursor:pointer}.icon-button svg{width:19px;height:19px;vertical-align:middle}.updated{display:block;color:#9aa3b7;font-size:12px;min-height:17px;margin-bottom:14px}.search{display:flex;margin:12px 0}.search input{min-width:0;flex:1;width:100%;height:44px;border:1px solid #30384a;border-radius:10px;background:#11151f;color:#e4e7ec;padding:10px;font-size:16px;-webkit-appearance:none}.search button{margin-left:8px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}article{position:relative;display:flex;align-items:center;background:#11151f;border:1px solid #262d3d;border-radius:12px;padding:10px 12px;margin:7px 0}.summary{flex:1;min-width:0;margin-right:10px}h2{font-size:15px;line-height:1.25;margin:0;overflow-wrap:break-word;word-wrap:break-word}h2 a{text-decoration:none;color:#e4e7ec}.version{color:#9aa3b7;font-size:11px;font-weight:400;margin-left:6px;word-break:break-all}.description{color:#c1c6d1;font-size:12px;line-height:1.35;margin:4px 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.targets{color:#d4a574;font-size:10px;margin:0}.action{flex-shrink:0}.download{display:inline-block;text-align:center;text-decoration:none;min-height:44px;padding:12px 10px;color:#e7b987;background:#191922;border:1px solid #5c4b3c;border-radius:9px;font-size:12px;cursor:pointer}.download:hover,.choices a:hover{background:#30271f}.choices{position:absolute;z-index:3;right:10px;top:calc(100% - 5px);width:156px;padding:4px;background:#161b27;border:1px solid #5c4b3c;border-radius:10px;box-shadow:0 10px 25px rgba(0,0,0,.45)}.choices a{display:block;padding:12px;min-height:44px;text-decoration:none;border-radius:6px}.empty{color:#c1c6d1;padding:24px 4px}.metadata{font-size:12px;margin-top:24px}.metadata a{display:inline-block;padding:10px 0}noscript a{display:inline-block;margin:4px;padding:8px}@media(min-width:600px){main{padding-top:36px}h1{font-size:34px}article{padding:12px 16px}h2{font-size:16px}.description{font-size:13px}}@supports(padding:max(0px)){main{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}}

/* Dynamic cards use the original uploaded page's compact styling. */
#package-status{margin:10px 0;color:#c1c6d1;font-size:12px}
.package-content{flex:1;min-width:0;margin-right:10px}
.package-title{display:flex;align-items:baseline;gap:6px;min-width:0}
.package-entry h3{font-size:15px;line-height:1.25;margin:0;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.package-version{color:#9aa3b7;font-size:11px;font-weight:400;min-width:0;max-width:45%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.package-description{color:#c1c6d1;font-size:12px;line-height:1.35;margin:4px 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.package-meta{color:#d4a574;font-size:10px;margin:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.package-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.package-download,.package-copy{display:inline-flex;align-items:center;justify-content:center;width:34px;min-height:44px;padding:3px;color:#e7b987;background:#191922;border:1px solid #5c4b3c;border-radius:9px;text-decoration:none;cursor:pointer}
.package-download svg,.package-copy svg{width:17px;height:17px}
.package-download:hover,.package-copy:hover{background:#30271f}
.package-copy{font-size:0}
.package-copy[data-feedback] svg{display:none}
.package-copy[data-feedback]::before{display:block;font-size:17px;line-height:1.2}
.package-copy[data-feedback="Copied!"]::before{content:'✓';color:#d4a574}
.package-copy[data-feedback="Copy failed"]::before{content:'!'}
.package-choices{position:fixed;z-index:30;width:156px;max-width:calc(100vw - 16px);padding:4px;background:#161b27;border:1px solid #5c4b3c;border-radius:10px;box-shadow:0 10px 25px rgba(0,0,0,.45);overflow-y:auto}
.package-target{display:block;width:100%;padding:12px;min-height:44px;border:0;border-radius:6px;background:transparent;color:#d4a574;text-decoration:none;text-align:left;cursor:pointer}
.package-target:hover{background:#30271f}
.architecture-filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.architecture-filters button{min-height:44px;padding:10px;font-size:12px;color:#c1c6d1;background:#11151f;border:1px solid #30384a;border-radius:10px;cursor:pointer}
.architecture-filters button[aria-pressed="true"]{color:#e7b987;background:#191922;border-color:#5c4b3c}
@media(min-width:600px){.package-entry h3{font-size:16px}.package-description{font-size:13px}}
</style></head><body><main>
<a class="back" href="index.html">← ipapplus Repo</a>
<header><div class="heading"><h1>Tweaks</h1><button class="icon-button" id="package-search-toggle" type="button" aria-label="Search packages" aria-controls="package-search-panel" aria-expanded="false"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10" cy="10" r="6"></circle><path d="m15 15 6 6"></path></svg></button></div>
<p class="updated" id="last-updated">Last Updated: Unknown</p></header><div id="package-search-panel" hidden><label class="sr-only" for="package-search">Search packages</label><div class="search"><input id="package-search" type="search" placeholder="Name, identifier, description, or filename" autocomplete="off" autocapitalize="none" spellcheck="false"></div><div class="architecture-filters" role="group" aria-label="Filter by architecture"><button type="button" data-architecture="" aria-pressed="true">All</button><button type="button" data-architecture="arm" aria-pressed="false">Rootful</button><button type="button" data-architecture="arm64" aria-pressed="false">Rootless</button><button type="button" data-architecture="arm64e" aria-pressed="false">RootHide</button></div></div><p id="package-status" role="status" aria-live="polite">Loading packages…</p><div id="package-list"></div><noscript>Enable JavaScript to browse packages.</noscript>
</main><script>
(function(){
  'use strict';
  const search=document.getElementById('package-search');
  const status=document.getElementById('package-status');
  const list=document.getElementById('package-list');
  const architectureButtons=document.querySelectorAll('[data-architecture]');
  const architectureNames={'iphoneos-arm':'arm','iphoneos-arm64':'arm64','iphoneos-arm64e':'arm64e'};
  const architectureLabels={arm:'Rootful',arm64:'Rootless',arm64e:'RootHide'};
  const searchToggle=document.getElementById('package-search-toggle');
  const searchPanel=document.getElementById('package-search-panel');
  const downloadIcon='<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"></path></svg>';
  const copyIcon='<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V4H4v12h4"></path></svg>';
  let selectedArchitecture='';
  let entries=[];
  function closeSearch(reset=false){
    searchPanel.hidden=true;
    searchToggle.setAttribute('aria-expanded','false');
    if(reset){
      search.value='';selectedArchitecture='';
      architectureButtons.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.architecture==='')));
      filterPackages();
    }
  }
  searchToggle.addEventListener('click',()=>{
    if(!searchPanel.hidden){closeSearch(true);return;}
    entries.forEach(closeChoices);
    searchPanel.hidden=false;
    searchToggle.setAttribute('aria-expanded','true');
    search.focus();
  });
  function closeChoices(entry){
    if(entry.choices){
      entry.choices.hidden=true;
      entry.download.setAttribute('aria-expanded','false');
      entry.copy.setAttribute('aria-expanded','false');
    }
  }
  document.addEventListener('click',event=>{
    // Search stays open until its toggle or Escape is pressed.
    entries.forEach(entry=>{
      if(!entry.card.contains(event.target)&&!(entry.choices&&entry.choices.contains(event.target)))closeChoices(entry);
    });
  });
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'){
      if(!searchPanel.hidden){closeSearch(true);searchToggle.focus();}
      entries.forEach(entry=>{
        if(entry.choices&&!entry.choices.hidden){closeChoices(entry);entry.download.focus();}
      });
    }
  });
  list.addEventListener('scroll',()=>entries.forEach(closeChoices));
  window.addEventListener('resize',()=>entries.forEach(closeChoices));
  window.addEventListener('scroll',()=>entries.forEach(closeChoices));
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',()=>entries.forEach(closeChoices));
    window.visualViewport.addEventListener('scroll',()=>entries.forEach(closeChoices));
  }
  function positionChoices(entry,button){
    const rect=button.getBoundingClientRect();
    const viewport=window.visualViewport;
    const left=viewport?viewport.offsetLeft:0,top=viewport?viewport.offsetTop:0;
    const width=viewport?viewport.width:window.innerWidth,height=viewport?viewport.height:window.innerHeight;
    const menu=entry.choices;
    menu.style.width=Math.min(156,width-16)+'px';
    menu.style.maxHeight=Math.max(40,height-16)+'px';
    menu.style.left=Math.max(left+8,Math.min(rect.right-menu.offsetWidth,left+width-menu.offsetWidth-8))+'px';
    const below=rect.bottom+6;
    menu.style.top=Math.max(top+8,Math.min(below+menu.offsetHeight<=top+height-8?below:rect.top-menu.offsetHeight-6,top+height-menu.offsetHeight-8))+'px';
  }
  function parsePackages(text){
    return text.replace(/\r\n?/g,'\n').split(/\n[ \t]*\n/).filter(block=>block.trim()).map(block=>{
      const fields=Object.create(null);
      let key='';
      for(const line of block.split('\n')){
        if(/^[ \t]/.test(line)){
          if(key)fields[key]+='\n'+(line.trim()==='.'?'':line.slice(1));
        }else{
          const colon=line.indexOf(':');
          key=colon>0?line.slice(0,colon):'';
          if(key)fields[key]=line.slice(colon+1).trim();
        }
      }
      return fields;
    });
  }
  function downloadURL(filename){
    if(!filename)return null;
    try{
      const url=new URL(filename,indexURL);
      return ['http:','https:'].includes(url.protocol)?url.href:null;
    }catch(error){return null;}
  }
  function sizeLabel(value){
    if(!value)return '';
    const bytes=Number(value);
    if(!Number.isFinite(bytes)||bytes<0)return '';
    if(bytes<1024)return bytes+' B';
    if(bytes<1048576)return (bytes/1024).toFixed(1)+' KB';
    return (bytes/1048576).toFixed(1)+' MB';
  }
  function addText(parent,tag,className,text){
    const element=document.createElement(tag);
    element.className=className;
    element.textContent=text;
    parent.appendChild(element);
    return element;
  }
  function filterPackages(){
    const query=search.value.toLowerCase();
    let count=0;
    for(const entry of entries){
      const matching=entry.variants.filter(variant=>variant.searchText.includes(query)&&(selectedArchitecture===''||variant.architecture===selectedArchitecture));
      entry.card.hidden=matching.length===0;
      entry.meta.textContent=[...new Set(matching.map(variant=>architectureLabels[variant.architecture]||variant.architecture))].join(' · ');
      entry.variants.forEach(variant=>{if(variant.row)variant.row.hidden=!matching.includes(variant);});
      closeChoices(entry);
      if(!entry.card.hidden)count++;
    }
    status.textContent=count+' of '+entries.length+' packages';
  }
  search.addEventListener('input',filterPackages);
  architectureButtons.forEach(button=>button.addEventListener('click',()=>{
    selectedArchitecture=button.dataset.architecture;
    architectureButtons.forEach(option=>option.setAttribute('aria-pressed',String(option===button)));
    filterPackages();
  }));
  async function copyLink(button,url){
    try{
      if(navigator.clipboard&&window.isSecureContext){
        await navigator.clipboard.writeText(url);
      }else{
        const area=document.createElement('textarea');
        area.value=url;area.style.position='fixed';area.style.opacity='0';
        document.body.appendChild(area);area.select();
        try{if(!document.execCommand('copy'))throw new Error('Copy failed');}
        finally{area.remove();button.focus();}
      }
      button.textContent='Copied!';
    }catch(error){
      button.textContent='Copy failed';
    }
    button.setAttribute('data-feedback',button.textContent);
    button.setAttribute('aria-label',button.textContent);
    clearTimeout(button.copyTimer);
    button.copyTimer=setTimeout(()=>{
      button.innerHTML=copyIcon;button.removeAttribute('data-feedback');
      button.setAttribute('aria-label','Copy download link');
    },2000);
  }
  const indexURL=new URL('Packages',window.location.href);
  const updated=document.getElementById('last-updated');
  let modifiedDate=null;
  function updateTime(){
    if(!modifiedDate)return;
    const seconds=Math.max(0,Math.floor((Date.now()-modifiedDate.getTime())/1000));
    let relative='Just now';
    if(seconds>=60){
      const unit=seconds>=86400?'day':seconds>=3600?'hour':'minute';
      const count=Math.floor(seconds/(unit==='day'?86400:unit==='hour'?3600:60));
      relative=count+' '+unit+(count===1?'':'s')+' ago';
    }
    updated.textContent='Last Updated: '+relative;
  }
  setInterval(updateTime,60000);
  fetch('Packages').then(response=>{
    if(!response.ok)throw new Error('Package index request failed');
    const modified=response.headers.get('Last-Modified');
    const date=modified?new Date(modified):null;
    if(date&&!Number.isNaN(date.getTime())){modifiedDate=date;updateTime();}
    return response.text();
  }).then(text=>{
    const fragment=document.createDocumentFragment();
    const groups=[];
    const groupsByKey=new Map();
    // Identity and version define one card across architecture builds.
    parsePackages(text).forEach(pkg=>{
      const key=JSON.stringify([pkg.Package,pkg.Version]);
      let group=groupsByKey.get(key);
      if(!pkg.Package||!pkg.Version||!group){
        group=[];groups.push(group);groupsByKey.set(key,group);
      }
      group.push(pkg);
    });
    entries=groups.map((group,groupIndex)=>{
      const pkg=group[0];
      const card=document.createElement('article');
      card.className='package-entry';
      const content=document.createElement('div');
      content.className='package-content';card.appendChild(content);
      const title=document.createElement('div');title.className='package-title';content.appendChild(title);
      const name=addText(title,'h3','',pkg.Name||pkg.Package||'Unnamed package');
      name.title=pkg.Package||name.textContent;
      if(pkg.Version){const version=addText(title,'span','package-version',pkg.Version);version.title=pkg.Version;}
      if(pkg.Description){const description=addText(content,'p','package-description',pkg.Description);description.title=pkg.Description;}
      const actions=document.createElement('div');
      actions.className='package-actions';card.appendChild(actions);
      const meta=addText(content,'p','package-meta','');
      const variants=group.map(item=>({
        pkg:item,architecture:architectureNames[item.Architecture]||item.Architecture,
        searchText:[item.Package,item.Name,item.Filename,item.Description].filter(Boolean).join('\n').toLowerCase()
      }));
      const entry={card,meta,variants};
      const available=variants.filter(variant=>downloadURL(variant.pkg.Filename));
      function addDownload(parent,item){
        const link=addText(parent,'a','package-download','');
        link.innerHTML=downloadIcon;
        link.setAttribute('aria-label','Download');
        link.href=downloadURL(item.Filename);
        link.setAttribute('download','');
        link.title=sizeLabel(item.Size)?'Download · '+sizeLabel(item.Size):'Download';
        const copy=addText(parent,'button','package-copy','Copy Link');
        copy.innerHTML=copyIcon;
        copy.type='button';
        copy.setAttribute('aria-label','Copy download link');
        copy.addEventListener('click',()=>copyLink(copy,link.href));
      }
      if(available.length===1){
        addDownload(actions,available[0].pkg);
      }else if(available.length>1){
        entry.download=addText(actions,'button','package-download','');
        entry.download.innerHTML=downloadIcon;
        entry.copy=addText(actions,'button','package-copy','Copy Link');
        entry.copy.innerHTML=copyIcon;
        entry.choices=document.createElement('div');
        entry.choices.className='package-choices';entry.choices.hidden=true;
        entry.choices.id='package-choices-'+groupIndex;
        document.body.appendChild(entry.choices);
        [entry.download,entry.copy].forEach(button=>{
          button.type='button';button.setAttribute('aria-expanded','false');
          button.setAttribute('aria-controls',entry.choices.id);
          button.setAttribute('aria-label',button===entry.copy?'Choose architecture to copy download link':'Download');
          button.addEventListener('click',()=>{
            const open=entry.choices.hidden;
            entries.forEach(closeChoices);
            entry.choices.hidden=!open;
            entry.download.setAttribute('aria-expanded',String(open));
            entry.copy.setAttribute('aria-expanded',String(open));
            if(open){
              variants.forEach(variant=>{
                if(!variant.row)return;
                variant.link.hidden=button===entry.copy;
                variant.copy.hidden=button!==entry.copy;
              });
              positionChoices(entry,button);
              const first=variants.find(variant=>variant.row&&!variant.row.hidden);
              if(first)(button===entry.copy?first.copy:first.link).focus();
            }
          });
        });
        variants.forEach(variant=>{
          const url=downloadURL(variant.pkg.Filename);
          if(!url)return;
          const row=document.createElement('div');row.className='package-choice';variant.row=row;
          const label=architectureLabels[variant.architecture]||variant.architecture;
          const link=addText(row,'a','package-target',label);variant.link=link;
          link.href=url;link.setAttribute('download','');
          link.title=sizeLabel(variant.pkg.Size)?'Download · '+sizeLabel(variant.pkg.Size):'Download';
          link.addEventListener('click',()=>closeChoices(entry));
          const copy=addText(row,'button','package-target',label);variant.copy=copy;
          copy.type='button';copy.hidden=true;
          copy.addEventListener('click',()=>{
            copyLink(entry.copy,link.href);closeChoices(entry);entry.copy.focus();
          });
          entry.choices.appendChild(row);
        });
      }
      fragment.appendChild(card);
      return entry;
    });
    list.appendChild(fragment);
    search.disabled=false;
    filterPackages();
  }).catch(()=>{
    status.textContent='Unable to load packages. Please reload to try again.';
  });
})();
</script></body></html>
