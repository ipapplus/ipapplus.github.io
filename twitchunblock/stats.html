<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0e10">
  <meta name="robots" content="noindex">
  <title>TwitchUnblock</title>
  <link rel="icon" href="./assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Page de statistiques d'utilisation : mêmes couleurs que le site.
       Deux séries (iOS, web) validées sur la surface sombre :
       #d95926 / #3987e5, ΔE CVD 26.8, contraste ≥ 3:1. */
    :root {
      color-scheme: dark;
      --bg: #0e0e10;
      --card: #18181b;
      --card-hi: #1f1f23;
      --line: rgba(255, 255, 255, 0.08);
      --text: #efeff1;
      --muted: #a1a1aa;
      --faint: #71717a;
      --purple: #bf94ff;
      --ios: #d95926;
      --web: #3987e5;
      --grid: rgba(255, 255, 255, 0.06);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
    main { max-width: 1080px; margin: 0 auto; padding: 28px 24px 64px; }
    a { color: var(--purple); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 24px; }
    header h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
    header h1 b { color: var(--purple); }
    .updated { color: var(--muted); font-size: 13px; }
    .spacer { flex: 1; }
    button { font: inherit; color: inherit; cursor: pointer; }
    .btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-weight: 600; font-size: 14px; }
    .btn:hover { background: var(--card-hi); }
    .btn:disabled { opacity: 0.5; cursor: default; }

    .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
    .tile .label { color: var(--muted); font-size: 13px; font-weight: 600; }
    .tile .partial { color: var(--faint); font-weight: 500; }
    .tile .value { font-size: 40px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; margin: 4px 0 8px; font-variant-numeric: tabular-nums; }
    .split { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
    .split span { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
    .dot.ios { background: var(--ios); }
    .dot.web { background: var(--web); }

    .grid2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 12px; margin-bottom: 12px; }
    h2 { margin: 0 0 4px; font-size: 16px; font-weight: 700; }
    .sub { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
    .legend { display: flex; gap: 16px; margin-bottom: 10px; font-size: 13px; color: var(--muted); }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }

    .chart { position: relative; }
    .chart svg { display: block; max-width: 100%; height: 220px; overflow: visible; }
    .chart .axis { fill: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
    .chart .gridline { stroke: var(--grid); stroke-width: 1; }
    .chart .hit { fill: transparent; cursor: default; }
    .chart .col.active rect.bar { opacity: 1; }
    .chart .dim rect.bar { opacity: 0.45; }
    .tip { position: absolute; pointer-events: none; z-index: 2; min-width: 150px; padding: 8px 10px; border-radius: 10px; background: rgba(9, 9, 11, 0.96); border: 1px solid var(--line); font-size: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); transform: translate(-50%, calc(-100% - 10px)); }
    .tip b { display: block; margin-bottom: 4px; font-size: 12px; }
    .tip div { display: flex; align-items: center; gap: 6px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .tip div em { margin-left: auto; padding-left: 12px; font-style: normal; color: var(--text); font-weight: 700; }

    .rows { display: flex; flex-direction: column; gap: 10px; }
    .row { display: grid; grid-template-columns: 112px minmax(0, 1fr) 44px; align-items: center; gap: 10px; font-size: 13px; }
    .row .name { color: var(--muted); }
    .row .num { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
    .track { height: 8px; border-radius: 4px; background: var(--card-hi); overflow: hidden; display: flex; gap: 2px; }
    .track i { display: block; height: 100%; border-radius: 4px; }
    .note { margin-top: 14px; color: var(--muted); font-size: 12px; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
    th, td { padding: 7px 4px; text-align: left; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; }
    td.n, th.n { text-align: right; }
    details { margin-top: 12px; }
    summary { cursor: pointer; color: var(--muted); font-size: 13px; }
    .err { color: #f87171; }
    .kinds { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
    .kind h2 { display: flex; align-items: center; gap: 8px; }
    .kind .nums { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 8px; font-variant-numeric: tabular-nums; }
    .kind .nums div { display: flex; flex-direction: column; }
    .kind .nums b { font-size: 26px; font-weight: 800; }
    .kind .nums span { color: var(--muted); font-size: 12px; }
    .who { color: var(--muted); font-size: 13px; }
    .who b { color: var(--text); }

    /* Outils développeur */
    .dev { border-color: rgba(191, 148, 255, 0.35); margin-top: 12px; }
    .dev h2 { color: var(--purple); }
    .dev-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 16px; }
    .btn.danger { border-color: rgba(248, 113, 113, 0.45); color: #fca5a5; }
    .btn.danger:hover { background: rgba(248, 113, 113, 0.12); }
    .btn.sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
    .dev-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
    .dev-form input { height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; font-size: 14px; min-width: 200px; }
    .dev-msg { min-height: 20px; margin: 0 0 10px; font-size: 13px; color: var(--muted); }
    .dev-msg.ok { color: #4ade80; }
    .dev-msg.err { color: #f87171; }
    .dev-table { max-height: 460px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
    .dev-table table th { position: sticky; top: 0; background: var(--card); }
    .dev-table td, .dev-table th { padding: 7px 10px; white-space: nowrap; }
    .tag { display: inline-block; padding: 1px 6px; border-radius: 5px; font-size: 11px; font-weight: 700; background: var(--card-hi); color: var(--muted); }
    .tag.acct { background: rgba(191, 148, 255, 0.16); color: var(--purple); }
    .dev-filter { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover, th.sortable.on { color: var(--text); }
    th.sortable .arrow { margin-left: 4px; font-size: 10px; opacity: 0.5; }
    th.sortable.on .arrow { opacity: 1; color: var(--purple); }

    .ann { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; background: var(--bg); }
    .ann h3 { margin: 0 0 2px; font-size: 14px; }
    .ann-form { display: flex; flex-direction: column; gap: 8px; }
    .ann-form input, .ann-form textarea, .ann-form select { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: 14px; }
    .ann-form textarea { resize: vertical; min-height: 64px; }
    .ann-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .ann-row label { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
    .ann-custom { display: inline-flex; gap: 6px; align-items: center; }
    .ann-custom[hidden] { display: none; }
    .ann-custom input { width: 80px; }
    .ann-renotify { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
    .ann-renotify[hidden] { display: none; }
    .ann-editing { outline: 2px solid var(--purple); outline-offset: 4px; border-radius: 10px; }
    .ann-reacts { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 8px; font-size: 15px; }
    .ann-reacts b { font-size: 13px; color: var(--text); font-variant-numeric: tabular-nums; }
    .ann-reacts .zero { opacity: 0.4; }
    .ann-current { margin-bottom: 10px; font-size: 13px; color: var(--muted); }
    .ann-current b { color: var(--text); }
    .ann-current .card-ish { border-left: 3px solid var(--purple); padding: 6px 10px; background: var(--card); border-radius: 6px; margin-top: 4px; white-space: pre-wrap; }
    footer { margin-top: 28px; color: var(--faint); font-size: 12px; line-height: 1.6; }

    @media (max-width: 820px) {
      main { padding: 20px 16px 48px; }
      .tiles { grid-template-columns: 1fr; }
      .grid2 { grid-template-columns: 1fr; }
      .kinds { grid-template-columns: 1fr; }
      .tile .value { font-size: 34px; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Twitch<b>Unblock</b> · <span data-t="h1"></span></h1>
    <span class="updated" id="updated"></span>
    <span class="who" id="who"></span>
    <span class="spacer"></span>
    <button class="btn" id="refresh" type="button" data-t="refresh"></button>
    <a class="btn" href="./" data-t="back"></a>
  </header>

  <section class="tiles" id="tiles" aria-live="polite"></section>

  <section class="kinds" id="kinds"></section>

  <section class="grid2">
    <div class="card">
      <h2 data-t="newTitle"></h2>
      <p class="sub" data-t="newSub"></p>
      <div class="legend"><span><i class="dot ios"></i><span data-t="ios"></span></span><span><i class="dot web"></i><span data-t="web"></span></span></div>
      <div class="chart" id="chart-new"></div>
      <details>
        <summary data-t="showTable"></summary>
        <table id="table-new"></table>
      </details>
    </div>
    <div class="card">
      <h2 data-t="loyTitle"></h2>
      <p class="sub" data-t="loySub"></p>
      <div class="rows" id="loyalty"></div>
      <p class="note" id="returning"></p>
    </div>
  </section>

  <section class="grid2">
    <div class="card">
      <h2 data-t="retTitle"></h2>
      <p class="sub" data-t="retSub"></p>
      <div class="rows" id="platform-returning"></div>
    </div>
    <div class="card">
      <h2 data-t="verTitle"></h2>
      <p class="sub" data-t="verSub"></p>
      <table id="versions"></table>
    </div>
  </section>

  <section class="card dev" id="dev" hidden>
    <h2 data-t="devTitle"></h2>
    <p class="sub" data-t="devSub"></p>
    <div class="dev-actions">
      <button class="btn danger" type="button" data-del="anon-web" data-t="delAnonWeb"></button>
      <button class="btn danger" type="button" data-del="anon" data-t="delAnon"></button>
      <button class="btn danger" type="button" data-del="once" data-t="delOnce"></button>
      <button class="btn danger" type="button" data-del="all" data-t="delAll"></button>
    </div>
    <div class="ann">
      <h3 data-t="annTitle"></h3>
      <p class="sub" data-t="annSub"></p>
      <div class="ann-current" id="ann-current"></div>
      <form class="ann-form" id="ann-form">
        <input id="ann-title" type="text" maxlength="80" data-tp="annTitlePh" autocomplete="off">
        <textarea id="ann-message" maxlength="500" rows="3" data-tp="annMsgPh"></textarea>
        <input id="ann-link" type="url" maxlength="300" data-tp="annLinkPh" autocomplete="off">
        <div class="ann-row">
          <label><span data-t="annFor"></span>
            <select id="ann-hours">
              <option value="keep" data-t="annKeep" hidden></option>
              <option value="1">1 h</option><option value="6">6 h</option><option value="24" selected>24 h</option>
              <option value="72">3 j</option><option value="168">7 j</option><option value="720">30 j</option>
              <option value="custom" data-t="annCustom"></option>
            </select>
          </label>
          <span class="ann-custom" id="ann-custom" hidden>
            <input id="ann-amount" type="number" min="1" step="1" value="2" inputmode="numeric">
            <select id="ann-unit">
              <option value="0.016666666666666666" data-t="unitMin"></option>
              <option value="1" data-t="unitHour" selected></option>
              <option value="24" data-t="unitDay"></option>
            </select>
          </span>
          <button class="btn" type="submit" id="ann-submit" data-t="annPublish"></button>
          <button class="btn" type="button" id="ann-cancel" data-t="annCancel" hidden></button>
          <button class="btn danger" type="button" id="ann-clear" data-t="annClear"></button>
        </div>
        <label class="ann-renotify" id="ann-renotify-row" hidden><input type="checkbox" id="ann-renotify"> <span data-t="annRenotify"></span></label>
      </form>
    </div>
    <form class="dev-form" id="sync-form">
      <input id="sync-login" type="text" data-tp="loginPh" autocomplete="off" spellcheck="false" maxlength="25">
      <button class="btn danger" type="submit" data-t="syncBtn"></button>
    </form>
    <p class="dev-msg" id="dev-msg" role="status"></p>
    <div class="dev-filter">
      <input id="dev-search" type="search" data-tp="filterPh" style="height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:13px;min-width:200px">
      <select id="dev-kind" style="height:32px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:13px"><option value="" data-t="fAllKinds"></option><option value="account" data-t="fAccounts"></option><option value="anonymous" data-t="fAnon"></option></select>
      <select id="dev-plat" style="height:32px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:13px"><option value="" data-t="fAllPlats"></option><option value="ios" data-t="fIosOnly"></option><option value="web" data-t="fWebOnly"></option><option value="both" data-t="fBoth"></option></select>
      <select id="dev-version" style="height:32px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:13px"></select>
      <span class="sub" id="dev-count" style="margin:0"></span>
    </div>
    <div class="dev-table"><table id="dev-entries"></table></div>
  </section>

  <footer data-t="footer"></footer>
</main>

<script src="config.js"></script>

      updated: 'Actualizado a las {t}', unavailable: 'Estadísticas no disponibles ({e})',
    },
  }
  const LANG = (() => {
    try { const l = JSON.parse(localStorage.getItem('tu_prefs') || '{}').lang; if (T[l]) return l } catch {}
    for (const l of navigator.languages ?? [navigator.language]) { const c = String(l || '').slice(0, 2).toLowerCase(); if (T[c]) return c }
    return 'en'
  })()
  const LOCALE = { fr: 'fr-FR', en: 'en-US', es: 'es-ES' }[LANG]
  const t = (k, v = {}) => (T[LANG][k] ?? T.en[k] ?? k).replace(/\{(\w+)\}/g, (_, n) => v[n] ?? '')
  document.documentElement.lang = LANG
  document.title = t('title')
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t) })
  document.querySelectorAll('[data-tp]').forEach((el) => { el.placeholder = t(el.dataset.tp) })
  const fmt = (n) => Number(n || 0).toLocaleString(LOCALE)
  const dayLabel = (iso, opts = { day: 'numeric', month: 'short' }) => new Date(iso + 'T00:00:00Z').toLocaleDateString(LOCALE, { timeZone: 'UTC', ...opts })

  function tiles(s) {
    const p = s.platforms ?? {}
    // Collecte plus récente que la période : on le dit, sinon « 7 jours » égal
    // à « aujourd'hui » a l'air d'un bug.
    const ageDays = s.oldestFirst ? Math.round((Date.parse(new Date().toISOString().slice(0, 10)) - Date.parse(s.oldestFirst)) / 86400000) : Infinity
    const tile = (label, key, span = 0) => `
      <div class="card tile">
        <div class="label">${label}${ageDays < span ? ` <span class="partial">· ${esc(t('partial', { d: dayLabel(s.oldestFirst) }))}</span>` : ''}</div>
        <div class="value">${fmt(s[key])}</div>
        <div class="split">
          <span><i class="dot ios"></i>iOS ${fmt(p.ios?.[key])}</span>
          <span><i class="dot web"></i>Web ${fmt(p.web?.[key])}</span>
        </div>
      </div>`
    $('#tiles').innerHTML = tile(t('today'), 'today') + tile(t('week'), 'week', 6) + tile(t('month'), 'month', 29)
  }

  /** Barres empilées iOS (bas) + web (haut), 2 px d'écart, haut arrondi. */
  function chartNew(days) {
    const box = $('#chart-new')
    if (!days?.length) { box.innerHTML = `<p class="sub">${esc(t('noDaily'))}</p>`; return }
    // Dessiné à la largeur réelle : rien n'est étiré (textes nets sur mobile).
    const W = Math.max(280, Math.round(box.clientWidth || 640)), H = 220, L = 30, R = 6, T = 8, B = 24
    const labelEvery = W < 480 ? 7 : 5
    const max = Math.max(1, ...days.map((d) => d.newIos + d.newWeb))
    const step = Math.ceil(max / 4)
    const top = step * 4
    const y = (v) => T + (H - T - B) * (1 - v / top)
    const bw = (W - L - R) / days.length
    const barW = Math.max(3, bw - 4)
    let svg = ''
    for (let v = 0; v <= top; v += step) {
      svg += `<line class="gridline" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>`
      svg += `<text class="axis" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`
    }
    // Barre arrondie seulement au bout libre (haut), base carrée sur l'axe.
    const bar = (x, y0, y1, color, roundTop) => {
      const h = y0 - y1
      if (h <= 0) return ''
      const r = roundTop ? Math.min(4, barW / 2, h) : 0
      return `<path class="bar" fill="${color}" d="M${x},${y0} V${y1 + r} Q${x},${y1} ${x + r},${y1} H${x + barW - r} Q${x + barW},${y1} ${x + barW},${y1 + r} V${y0} Z"/>`
    }
    days.forEach((d, i) => {
      const x = L + i * bw + (bw - barW) / 2
      const yIos = y(d.newIos)
      const yAll = y(d.newIos + d.newWeb)
      const webBottom = d.newIos > 0 ? yIos - 2 : y(0)   // 2 px d'écart entre segments
      svg += `<g class="col" data-i="${i}">`
      svg += bar(x, y(0), yIos, 'var(--ios)', d.newWeb === 0)
      if (d.newWeb > 0) svg += bar(x, webBottom, Math.min(yAll, webBottom - 1), 'var(--web)', true)
      svg += `<rect class="hit" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}"/></g>`
      // Un libellé tous les N jours, plus le dernier ; un libellé trop proche
      // du dernier est sauté pour ne pas le chevaucher.
      const last = i === days.length - 1
      if (last || (i % labelEvery === 0 && days.length - 1 - i >= labelEvery / 2)) {
        svg += `<text class="axis" x="${last ? x + barW : x + barW / 2}" y="${H - 6}" text-anchor="${last ? 'end' : 'middle'}">${esc(dayLabel(d.date))}</text>`
      }
    })
    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(t('newTitle'))}">${svg}</svg><div class="tip" hidden></div>`

    // Survol : info-bulle par colonne, les autres colonnes s'estompent.
    const svgEl = box.querySelector('svg')
    const tip = box.querySelector('.tip')
    const show = (g) => {
      const d = days[Number(g.dataset.i)]
      svgEl.classList.add('dim')
      for (const c of svgEl.querySelectorAll('.col')) c.classList.toggle('active', c === g)
      tip.innerHTML = `<b>${esc(dayLabel(d.date, { weekday: 'long', day: 'numeric', month: 'long' }))}</b>
        <div><i class="dot ios"></i>iOS<em>${fmt(d.newIos)}</em></div>
        <div><i class="dot web"></i>Web<em>${fmt(d.newWeb)}</em></div>`
      const hit = g.querySelector('.hit').getBoundingClientRect()
      const host = box.getBoundingClientRect()
      tip.style.left = `${Math.min(host.width - 80, Math.max(80, hit.left - host.left + hit.width / 2))}px`
      tip.style.top = `${Math.max(40, hit.top - host.top + 30)}px`
      tip.hidden = false
    }
    const hide = () => { svgEl.classList.remove('dim'); for (const c of svgEl.querySelectorAll('.col')) c.classList.remove('active'); tip.hidden = true }
    for (const g of svgEl.querySelectorAll('.col')) {
      g.addEventListener('pointerenter', () => show(g))
      g.addEventListener('click', () => show(g))
    }
    svgEl.addEventListener('pointerleave', hide)

    $('#table-new').innerHTML = `<thead><tr><th>${t('thDay')}</th><th class="n">iOS</th><th class="n">Web</th></tr></thead><tbody>${
      days.slice().reverse().map((d) => `<tr><td>${esc(dayLabel(d.date, { weekday: 'short', day: 'numeric', month: 'short' }))}</td><td class="n">${fmt(d.newIos)}</td><td class="n">${fmt(d.newWeb)}</td></tr>`).join('')}</tbody>`
  }

  function loyalty(s) {
    const l = s.loyalty ?? {}
    const rows = [[t('once'), l.once], [t('few'), l.few], [t('regular'), l.regular], [t('daily'), l.daily]]
    const total = Math.max(1, rows.reduce((n, r) => n + (r[1] || 0), 0))
    $('#loyalty').innerHTML = rows.map(([name, n], i) => `
      <div class="row"><span class="name">${name}</span>
        <span class="track"><i style="width:${((n || 0) / total) * 100}%;background:${i === 0 ? 'var(--faint)' : 'var(--purple)'}"></i></span>
        <span class="num">${fmt(n)}</span></div>`).join('')
    $('#returning').textContent = t('returning', { a: fmt(s.returning), b: fmt(s.known), d: (s.avgDays ?? 0).toLocaleString(LOCALE) }) + (s.oldestFirst ? t('since', { date: dayLabel(s.oldestFirst, { day: 'numeric', month: 'long', year: 'numeric' }) }) : '')
  }

  function platformReturning(s) {
    const rows = [[t('ios'), 'ios'], [t('web'), 'web']].map(([name, k]) => {
      const p = s.platforms?.[k] ?? {}
      return { name, k, known: p.known || 0, back: p.returning }
    })
    $('#platform-returning').innerHTML = rows.map((r) => {
      if (r.back === undefined) return `<div class="row"><span class="name">${r.name}</span><span class="sub">${t('redeploy')}</span><span></span></div>`
      const pct = r.known ? Math.round((r.back / r.known) * 100) : 0
      return `<div class="row"><span class="name"><i class="dot ${r.k}" style="display:inline-block;margin-right:6px"></i>${r.name}</span>
        <span class="track"><i style="width:${pct}%;background:var(--${r.k})"></i></span>
        <span class="num">${fmt(r.back)}</span></div>
        <div class="row" style="margin-top:-6px"><span></span><span class="sub" style="margin:0">${t('pctOf', { p: pct, n: fmt(r.known) })}</span><span></span></div>`
    }).join('')
  }

  function versions(s) {
    const list = (s.versions ?? []).slice(0, 12)
    $('#versions').innerHTML = `<thead><tr><th>${t('thVersion')}</th><th class="n">${t('thActive')}</th></tr></thead><tbody>${
      list.map((v) => {
        const [plat, ...rest] = String(v.version).split(' ')
        return `<tr><td><i class="dot ${plat === 'web' ? 'web' : 'ios'}" style="display:inline-block;margin-right:8px"></i>${esc(plat === 'web' ? 'Web' : 'iOS')} ${esc(rest.join(' '))}</td><td class="n">${fmt(v.count)}</td></tr>`
      }).join('') || '<tr><td colspan="2" class="sub">—</td></tr>'}</tbody>`
  }

  function kinds(s) {
    const card = (title, tag, k) => {
      const v = s[k]
      if (!v) return `<div class="card kind"><h2>${title}</h2><p class="sub">${t('redeploy')}</p></div>`
      return `<div class="card kind"><h2>${title} <span class="tag ${tag}">${fmt(v.known)}</span></h2>
        <div class="nums"><div><b>${fmt(v.today)}</b><span>${t('kToday')}</span></div><div><b>${fmt(v.week)}</b><span>${t('kWeek')}</span></div>
        <div><b>${fmt(v.month)}</b><span>${t('kMonth')}</span></div><div><b>${fmt(v.returning)}</b><span>${t('kBack')}</span></div></div></div>`
    }
    $('#kinds').innerHTML = card(t('accounts'), 'acct', 'accounts') + card(t('anonymous'), '', 'anonymous')
  }

  // ── Compte connecté et outils développeur ────────────────────────────
  const ADMIN = `${BASE}/api/admin`
  let token = null
  try { token = localStorage.getItem('twitch_token') } catch {}
  const authed = (path, init = {}) => fetch(ADMIN + path, { ...init, cache: 'no-store', headers: { ...(init.headers || {}), Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' } })
  let entries = []

  async function checkAdmin() {
    if (!token) { $('#who').textContent = ''; return }
    try {
      const me = await (await authed('/me')).json()
      if (me.login) $('#who').innerHTML = `${t('signedIn')} <b>${esc(me.login)}</b>${me.admin ? ' · admin' : ''}`
      if (me.admin) { $('#dev').hidden = false; loadEntries(); loadAnnouncement() }
    } catch {}
  }

  async function loadEntries() {
    try {
      const res = await authed('/usage')
      if (!res.ok) throw new Error(`HTTP ${res.status}`)
      entries = (await res.json()).entries ?? []
      fillFilters()
      renderEntries()
    } catch (e) { devMsg(t('listErr', { e: e.message }), 'err') }
  }

  // Tri et filtres du tableau : clic sur un en-tête pour trier (re-clic =
  // sens inverse), listes pour ne garder qu'un type, une plateforme, une version.
  let sort = { key: 'last', dir: -1 }
  const SORTERS = {
    who: (e) => (e.kind === 'account' ? '0' : '1') + (e.login || e.key).toLowerCase(),
    platforms: (e) => String(e.platforms),
    version: (e) => String(e.version || ''),
    first: (e) => e.first || '',
    last: (e) => e.last || '',
    days: (e) => e.days || 0,
  }
  const cmp = (a, b) => (typeof a === 'number' ? a - b : String(a).localeCompare(String(b), LOCALE, { numeric: true }))

  function fillFilters() {
    const sel = $('#dev-version'), cur = sel.value
    const versions = [...new Set(entries.map((e) => String(e.version || '?')))].sort((a, b) => cmp(b, a))
    sel.innerHTML = `<option value="">${esc(t('fAllVersions'))}</option>` + versions.map((v) => `<option value="${esc(v)}">${esc(v)} (${fmt(entries.filter((e) => String(e.version || '?') === v).length)})</option>`).join('')
    sel.value = versions.includes(cur) ? cur : ''
  }

  function renderEntries() {
    const q = $('#dev-search').value.trim().toLowerCase()
    const kind = $('#dev-kind').value, plat = $('#dev-plat').value, ver = $('#dev-version').value
    const list = entries.filter((e) => {
      const ps = String(e.platforms).split(',')
      if (q && ![e.login, e.version, e.platforms, e.key].join(' ').toLowerCase().includes(q)) return false
      if (kind && e.kind !== kind) return false
      if (plat === 'both' && ps.length < 2) return false
      if ((plat === 'ios' || plat === 'web') && !(ps.length === 1 && ps[0] === plat)) return false
      if (ver && String(e.version || '?') !== ver) return false
      return true
    })
    const get = SORTERS[sort.key]
    list.sort((a, b) => cmp(get(a), get(b)) * sort.dir || cmp(b.last || '', a.last || ''))
    $('#dev-count').textContent = t('entries', { a: fmt(list.length), b: fmt(entries.length) })
    const th = (key, label, cls = '') => `<th class="sortable ${cls}${sort.key === key ? ' on' : ''}" data-sort="${key}" aria-sort="${sort.key === key ? (sort.dir > 0 ? 'ascending' : 'descending') : 'none'}">${label}<span class="arrow">${sort.key === key ? (sort.dir > 0 ? '▲' : '▼') : '↕'}</span></th>`
    $('#dev-entries').innerHTML = `<thead><tr>${th('who', t('thWho'))}${th('platforms', t('thPlat'))}${th('version', t('thVersion'))}${th('first', t('thFirst'))}${th('last', t('thLast'))}${th('days', t('thDays'), 'n')}<th></th></tr></thead><tbody>${
      list.slice(0, 400).map((e) => `<tr>
        <td>${e.kind === 'account' ? `<span class="tag acct">${t('tagAcct')}</span> ${esc(e.login)}` : `<span class="tag">${t('tagAnon')}</span> ${esc(e.key.replace('usage_', '').slice(0, 8))}…`}</td>
        <td>${esc(String(e.platforms).replace('ios', 'iOS').replace('web', 'Web'))}</td><td>${esc(e.version)}</td>
        <td>${esc(e.first ?? '')}</td><td>${esc(e.last ?? '')}</td><td class="n">${fmt(e.days)}</td>
        <td><button class="btn sm danger" type="button" data-key="${esc(e.key)}">${t('del')}</button></td></tr>`).join('')}</tbody>`
  }

  // ── Annonce dans l'app ──────────────────────────────────────────────
  let annCurrent = null
  let annEditing = false
  function renderAnnouncement(a, reactions = null) {
    annCurrent = a
    const box = $('#ann-current')
    if (!a) { box.textContent = t('annNone'); if (annEditing) setEditing(false); return }
    const until = new Date(a.until).toLocaleString(LOCALE, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
    box.innerHTML = `${esc(t('annLive', { d: until }))}${a.editedAt ? ` <span class="tag">${esc(t('annEdited'))}</span>` : ''}
      <button class="btn sm" type="button" id="ann-edit" style="margin-left:6px">${esc(t('annEdit'))}</button>
      <div class="card-ish">${a.title ? `<b>${esc(a.title)}</b>\n` : ''}${esc(a.message || '')}${a.link ? `\n<a href="${esc(a.link)}" target="_blank" rel="noopener">${esc(a.link)}</a>` : ''}</div>
      ${reactions ? `<div class="ann-reacts" title="${esc(t('annReactions'))}">${Object.entries(reactions.counts).map(([e, n]) => `<span class="${n ? '' : 'zero'}">${e} <b>${fmt(n)}</b></span>`).join('')}<span class="sub" style="margin:0">${esc(t('annReactTotal', { n: fmt(reactions.total) }))}</span></div>` : ''}`
    $('#ann-edit').onclick = () => setEditing(true)
  }
  /** Mode modification : le formulaire reprend l'annonce en cours. */
  function setEditing(on) {
    annEditing = on && Boolean(annCurrent)
    const keep = $('#ann-hours option[value="keep"]')
    keep.hidden = !annEditing
    $('#ann-renotify-row').hidden = !annEditing
    $('#ann-cancel').hidden = !annEditing
    $('#ann-submit').textContent = t(annEditing ? 'annSave' : 'annPublish')
    $('#ann-form').classList.toggle('ann-editing', annEditing)
    if (annEditing) {
      $('#ann-title').value = annCurrent.title || ''
      $('#ann-message').value = annCurrent.message || ''
      $('#ann-link').value = annCurrent.link || ''
      $('#ann-hours').value = 'keep'
      $('#ann-renotify').checked = false
      $('#ann-title').focus()
    } else {
      $('#ann-title').value = ''; $('#ann-message').value = ''; $('#ann-link').value = ''
      if ($('#ann-hours').value === 'keep') $('#ann-hours').value = '24'
    }
    $('#ann-custom').hidden = $('#ann-hours').value !== 'custom'
  }
  async function loadAnnouncement() {
    try { const r = await (await authed('/announcement')).json(); renderAnnouncement(r.announcement, r.reactions) } catch {}
  }
  async function postAnnouncement(body, okMsg) {
    try {
      const res = await authed('/announcement', { method: 'POST', body: JSON.stringify(body) })
      const r = await res.json()
      if (!res.ok) throw new Error(r.error || `HTTP ${res.status}`)
      renderAnnouncement(r.announcement)
      loadAnnouncement()   // décompte des réactions à jour
      devMsg(okMsg, 'ok')
      return true
    } catch (e) { devMsg(t('fail', { e: e.message }), 'err'); return false }
  }
  $('#ann-form').addEventListener('submit', async (e) => {
    e.preventDefault()
    const choice = $('#ann-hours').value
    let hours = Number(choice)
    if (choice === 'custom') {
      hours = Number($('#ann-amount').value) * Number($('#ann-unit').value)
      if (!(hours >= 1 / 60 - 1e-6 && hours <= 720)) return devMsg(t('annBadDuration'), 'err')
    }
    const body = { title: $('#ann-title').value, message: $('#ann-message').value, link: $('#ann-link').value }
    if (annEditing) Object.assign(body, { edit: true, renotify: $('#ann-renotify').checked }, choice === 'keep' ? { keepUntil: true } : { hours })
    else body.hours = hours
    const ok = await postAnnouncement(body, t(annEditing ? 'annSaved' : 'annPublished'))
    if (ok) setEditing(false)
  })
  $('#ann-cancel').addEventListener('click', () => setEditing(false))
  $('#ann-hours').addEventListener('change', () => { $('#ann-custom').hidden = $('#ann-hours').value !== 'custom' })
  $('#ann-clear').addEventListener('click', () => { if (confirm(t('annConfirmClear'))) postAnnouncement({ clear: true }, t('annCleared')) })

  function devMsg(text, kind = '') { const m = $('#dev-msg'); m.textContent = text; m.className = `dev-msg ${kind}` }

  async function deleteUsage(body, label) {
    if (!confirm(t('confirm', { l: label }))) return
    devMsg(t('deleting'))
    try {
      const res = await authed('/usage/delete', { method: 'POST', body: JSON.stringify(body) })
      const r = await res.json()
      if (!res.ok) throw new Error(r.error || `HTTP ${res.status}`)
      devMsg(t('deleted', { n: fmt(r.deleted) }) + (r.remaining ? t('remaining', { n: fmt(r.remaining) }) : '') + '.', 'ok')
      await Promise.all([loadEntries(), load()])
    } catch (e) { devMsg(t('fail', { e: e.message }), 'err') }
  }

  const LABELS = { 'anon-web': t('lAnonWeb'), anon: t('lAnon'), once: t('lOnce'), all: t('lAll') }
  document.querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', () => deleteUsage({ target: b.dataset.del }, LABELS[b.dataset.del])))
  $('#dev-entries').addEventListener('click', (e) => {
    const h = e.target.closest('[data-sort]')
    if (h) {
      const k = h.dataset.sort
      // Nouvelle colonne : texte de A à Z, dates et jours du plus récent/grand.
      sort = sort.key === k ? { key: k, dir: -sort.dir } : { key: k, dir: ['who', 'platforms'].includes(k) ? 1 : -1 }
      return renderEntries()
    }
    const b = e.target.closest('[data-key]')
    if (b) deleteUsage({ target: 'key', key: b.dataset.key }, t('lKey', { k: b.dataset.key }))
  })
  $('#dev-search').addEventListener('input', renderEntries)
  for (const id of ['#dev-kind', '#dev-plat', '#dev-version']) $(id).addEventListener('change', renderEntries)
  $('#sync-form').addEventListener('submit', async (e) => {
    e.preventDefault()
    const login = $('#sync-login').value.trim().toLowerCase()
    if (!login || !confirm(t('syncConfirm', { u: login }))) return
    try {
      const res = await authed('/sync/delete', { method: 'POST', body: JSON.stringify({ login }) })
      const r = await res.json()
      if (!res.ok) throw new Error(r.error || `HTTP ${res.status}`)
      devMsg(r.existed ? t('syncDone', { u: login }) : t('syncNone', { u: login }), 'ok')
    } catch (err) { devMsg(t('fail', { e: err.message }), 'err') }
  })

  async function load() {
    const btn = $('#refresh')
    btn.disabled = true
    try {
      const res = await fetch(API, { cache: 'no-store' })
      if (!res.ok) throw new Error(`HTTP ${res.status}`)
      const s = await res.json()
      lastDaily = s.daily
      tiles(s); kinds(s); chartNew(s.daily); loyalty(s); platformReturning(s); versions(s)
      const at = s.generatedAt ? new Date(s.generatedAt) : new Date()
      $('#updated').textContent = t('updated', { t: at.toLocaleTimeString(LOCALE, { hour: '2-digit', minute: '2-digit' }) })
    } catch (e) {
      $('#updated').innerHTML = `<span class="err">${esc(t('unavailable', { e: e.message }))}</span>`
    } finally {
      btn.disabled = false
    }
  }
  let lastDaily = null
  let resizeTimer = null
  addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => lastDaily && chartNew(lastDaily), 150) })
  $('#refresh').addEventListener('click', () => { load(); if (!$('#dev').hidden) { loadEntries(); loadAnnouncement() } })
  load()
  checkAdmin()
  // Rafraîchi toutes les 2 minutes tant que la page est affichée.
  setInterval(() => { if (!document.hidden) load() }, 120_000)
  }
</script>
</body>
</html>
